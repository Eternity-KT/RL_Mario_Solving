name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Phiên bản Python lấy từ file .python-version (3.11). Không dùng 3.13:
      # pyproject.toml ghim numpy<2 (nes-py 8.2.1 tràn số với NumPy 2) mà numpy 1.x không có bản cho 3.13.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip

      - name: Install build tools for nes-py
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install dependencies
        id: deps
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .

      # Nếu cài nes-py thất bại vẫn đảm bảo có pytest; tests/conftest.py sẽ
      # tự bỏ qua các test cần môi trường NES.
      - name: Ensure pytest is available
        run: python -m pip install pytest

      - name: Run pytest
        run: |
          set +e
          python -m pytest -v
          code=$?
          # Exit code 5 = không thu thập được test nào (vd. thiếu NES) -> coi là pass.
          if [ "$code" -eq 5 ]; then
            echo "::warning::No tests collected (NES emulator likely unavailable)."
            exit 0
          fi
          exit $code

      - name: Report dependency install failure
        if: steps.deps.outcome == 'failure'
        run: echo "::warning::Full dependency install failed; NES-dependent tests were skipped."
