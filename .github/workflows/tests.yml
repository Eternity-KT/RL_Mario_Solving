name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Phiên bản Python 3.11 được chỉ định trong .python-version (phù hợp với numpy<2 và nes-py 8.2.1)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip

      - name: Install build tools and system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1 libglib2.0-0 ffmpeg

      - name: Install dependencies from pyproject.toml
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .

      - name: Verify package installation
        run: |
          python -c "import torch; import gymnasium; import mo_gymnasium; import mario_ppo; print('Core packages and mario_ppo verified successfully!')"

      - name: Run ActorCritic Unit Tests (Person 2 - Strict Gatekeeper)
        run: |
          python -m pytest -v tests/test_model.py

      - name: Run Full Test Suite (Team Milestone 1 Tracker)
        id: full_suite
        continue-on-error: true
        run: |
          python -m pytest -v --tb=short

      - name: Team Milestone 1 Progress Summary
        run: |
          if [ "${{ steps.full_suite.outcome }}" == "success" ]; then
            echo "::notice title=Milestone 1 Complete::All 35 tests passed! Ready for training phase."
          else
            echo "::warning title=Development In Progress::Model tests passed (5/5). Teammate modules (wrappers/ppo/pipeline) are in progress under 14-day schedule."
          fi
