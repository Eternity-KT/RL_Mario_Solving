name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Phiên bản Python lấy từ file .python-version (3.11). Không dùng 3.13:
      # pyproject.toml ghim numpy<2 (nes-py 8.2.1 tràn số với NumPy 2) mà numpy 1.x không có bản cho 3.13.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
          # Dự án không còn requirements.txt (mặc định của cache pip); khóa cache theo pyproject.toml.
          cache-dependency-path: pyproject.toml

      - name: Install build tools for nes-py
        run: sudo apt-get update && sudo apt-get install -y build-essential

      # Cài đặt phải thành công: wrappers.py import gym_super_mario_bros (cần nes-py) ngay từ đầu, nên thiếu
      # trình giả lập thì test_wrappers / test_pipeline / test_nhom_* không import được. Không bỏ qua các test
      # đó để tránh CI báo xanh giả; nếu bước này lỗi, xem log biên dịch nes-py.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          python -m pip check

      - name: Check imports
        run: python -c "import torch, gymnasium, nes_py, gym_super_mario_bros, mo_gymnasium, cv2, omegaconf; print('torch', torch.__version__, '| gymnasium', gymnasium.__version__)"

      # Gồm 35 bài công khai của đề (test_wrappers/model/gae/ppo/pipeline) và các bài bổ sung của nhóm
      # (tests/test_nhom_*.py). Trước khi cài xong các phần TODO, bước này đỏ là bình thường.
      - name: Run pytest
        run: python -m pytest -v --durations=10
